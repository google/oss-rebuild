name: GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/gh-pages.yml"]
  pull_request:
    branches: ["main"]
    paths: ["docs/**", ".github/workflows/gh-pages.yml"]

permissions: {} # granted per-job

# Allow one run at a time. Skip queued runs. Let existing run finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: docs

jobs:
  build:
    if: github.repository == 'google/oss-rebuild' # Only run in the upstream repo
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      pages: read # actions/configure-pages
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install Hugo
        run: |
          HUGO_DIR="${HOME}/.local/hugo"
          mkdir -p "${HUGO_DIR}"
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | tar -xz -C "${HUGO_DIR}"
          echo "${HUGO_DIR}" >> "${GITHUB_PATH}"
      - name: Build the site
        run: |
          hugo --gc --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./docs/public
  deploy:
    # Only run on push, and in the upstream repo
    if: >
      github.event_name == 'push'
      && github.repository == 'google/oss-rebuild'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # actions/deploy-pages
      id-token: write # actions/deploy-pages OIDC token
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
